name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/contractlens"
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Run production build
        env:
          DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/contractlens"
        run: npm run build
